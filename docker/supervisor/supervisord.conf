[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=0

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=0

[program:aimeos-jobs]
command=php /var/www/html/artisan aimeos:jobs "order/email/delivery order/email/payment"
autostart=true
autorestart=true
startsecs=0
startretries=3
stdout_logfile=/var/log/supervisor/aimeos-jobs.log
stderr_logfile=/var/log/supervisor/aimeos-jobs-error.log
