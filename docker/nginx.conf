server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    index index.php;

    charset utf-8;

    # Maximum file upload size (for product images, etc.)
    client_max_body_size 64M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # Disable absolute redirects (important for reverse proxy)
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|gif|png|css|js|ico|xml|webp|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM configuration
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        include fastcgi_params;

        # Hide PHP version
        fastcgi_hide_header X-Powered-By;

        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        # Buffers
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Reverse proxy support (Dokploy/Traefik)
        # Pass X-Forwarded headers to PHP-FPM for Laravel's TrustProxies
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

        # Set HTTPS param based on X-Forwarded-Proto from upstream proxy
        set $fastcgi_https off;
        if ($http_x_forwarded_proto = "https") {
            set $fastcgi_https on;
        }
        fastcgi_param HTTPS $fastcgi_https;
    }

    # Prevent access to hidden files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Prevent access to backup/config/source files
    location ~* (?:\.(?:bak|conf|dist|fla|in[ci]|log|psd|sh|sql|sw[op])|~)$ {
        deny all;
    }

    # Fix: File upload over https fails signature verification
    # https://github.com/livewire/livewire/discussions/3084
    location ^~ /livewire {
        try_files $uri $uri/ /index.php?$args;
    }
}